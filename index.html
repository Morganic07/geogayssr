<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="description" content="Jeu de géographie : reconnaître les pays du monde sur la carte.">
<title>GeoGayssr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-sombre.css">
<link rel="stylesheet" href="css/theme-sorbet.css" data-theme="sorbet">
<script>
  window.THEMES = ['sombre', 'sorbet'];
  window.appliquerFeuilleTheme = function (nom) {
    if (window.THEMES.indexOf(nom) < 0) return false;
    var feuilles = document.querySelectorAll('link[data-theme]');
    for (var i = 0; i < feuilles.length; i++) {
      feuilles[i].disabled = feuilles[i].getAttribute('data-theme') !== nom;
    }
    return true;
  };
  (function () {
    var url = new URLSearchParams(location.search).get('theme');
    var memorise = null;
    try { memorise = localStorage.getItem('geogayssr.theme'); } catch (e) { /* stockage indisponible */ }
    var choisi = window.THEMES.indexOf(url) >= 0 ? url
      : (window.THEMES.indexOf(memorise) >= 0 ? memorise : 'sombre');
    window.THEME_ACTIF = choisi;
    window.appliquerFeuilleTheme(choisi);
  })();
</script>
</head>
<body>

<div id="ecran-pivoter">
  <div class="pivoter-icone" aria-hidden="true"></div>
  <p>Tourne ton téléphone à l'horizontale.</p>
</div>

<main>

  <section id="ecran-accueil" class="ecran est-actif">
    <h1>Geo<span class="accent">Gay</span>ssr</h1>

    <div class="options">

    <div class="groupe">
      <p class="intitule">Mode</p>
      <div class="choix">
        <label><input type="radio" name="mode" value="clic" checked> Cliquer le pays</label>
        <label><input type="radio" name="mode" value="saisie"> Écrire son nom</label>
        <label><input type="radio" name="mode" value="forme"> Deviner la forme</label>
      </div>
    </div>

    <div class="groupe">
      <p class="intitule">Carte</p>
      <div class="choix">
        <label><input type="radio" name="perimetre" value="onu" checked> Les 197 de l'ONU</label>
        <label><input type="radio" name="perimetre" value="units"> Tous les territoires (296)</label>
        <label><input type="radio" name="perimetre" value="subunits"> Territoires extrêmes (358)</label>
        <label><input type="radio" name="perimetre" value="hors-onu"> Hors ONU seulement (169)</label>
      </div>
    </div>

    <div class="groupe">
      <p class="intitule" id="titre-zone">Zone</p>
      <div class="choix">
        <select id="choix-zone" aria-labelledby="titre-zone">
          <option value="">Monde entier</option>
        </select>
      </div>
    </div>

    <div class="groupe">
      <p class="intitule">Nombre de pays</p>
      <div class="choix">
        <label><input type="radio" name="longueur" value="nombre" checked> Rentrer une valeur</label>
        <input type="number" id="nombre-pays" class="champ-nombre" value="10"
               min="1" step="1" inputmode="numeric" aria-label="Nombre de pays à deviner">
        <label><input type="radio" name="longueur" value="tout"> Tous les pays</label>
      </div>
    </div>

    <div class="groupe">
      <p class="intitule">En cas d'erreur</p>
      <div class="choix">
        <label><input type="radio" name="politique" value="une-chance" checked> Une seule chance</label>
        <label><input type="radio" name="politique" value="rattrapage"> Le pays revient plus tard</label>
      </div>
    </div>

    <div class="groupe">
      <p class="intitule">Thème</p>
      <div class="choix">
        <label><input type="radio" name="theme" value="sombre"> Sombre</label>
        <label><input type="radio" name="theme" value="sorbet"> Sorbet</label>
      </div>
    </div>

    </div>

    <p id="meilleur-score" hidden></p>
    <p id="erreur-chargement" class="retour est-faux" hidden></p>
    <p id="maj-disponible" class="retour" hidden>
      Une nouvelle version est prête.
      <button type="button" id="bouton-maj" class="bouton-discret">Mettre à jour</button>
    </p>

    <div class="actions">
      <button type="button" id="bouton-jouer" class="bouton-principal">Jouer</button>
      <button type="button" id="bouton-voir-erreurs" class="bouton-discret" hidden>Voir mes erreurs</button>
    </div>
  </section>

  <section id="ecran-erreurs" class="ecran">
    <h2>Mes erreurs</h2>
    <p id="erreurs-resume"></p>
    <ul id="liste-erreurs" class="liste-rates"></ul>
    <div class="actions">
      <button type="button" id="bouton-reviser" class="bouton-principal">Réviser mes erreurs</button>
      <button type="button" id="bouton-retour-accueil" class="bouton-discret">Retour</button>
    </div>
  </section>

  <section id="ecran-jeu" class="ecran">
    <div class="barre">
      <p id="consigne" class="question"></p>
      <input type="text" id="champ-reponse" hidden aria-label="Nom du pays surligné"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" placeholder="Nom du pays">
      <button type="button" id="bouton-valider" hidden>OK</button>
      <p id="retour" class="retour" role="status" aria-live="polite"></p>
      <p id="progression" class="progression"></p>
      <button type="button" id="bouton-reset" class="bouton-discret bouton-icone"
              aria-label="Recommencer la partie" title="Recommencer">↻</button>
      <button type="button" id="bouton-parametres" class="bouton-discret bouton-icone"
              aria-label="Ouvrir les paramètres" title="Paramètres">⚙</button>
    </div>

    <div class="conteneur-carte">
      <svg id="carte" role="img" aria-label="Carte du monde"></svg>
      <svg id="silhouette" role="img" aria-label="Forme du territoire à reconnaître" hidden></svg>
    </div>
  </section>

  <div id="panneau-parametres" class="panneau" hidden
       role="dialog" aria-modal="true" aria-labelledby="titre-parametres">
    <div class="panneau-boite">
      <h2 id="titre-parametres">Paramètres</h2>

      <div class="groupe">
        <p class="intitule">Thème</p>
        <label><input type="radio" name="theme-jeu" value="sombre"> Sombre</label>
        <label><input type="radio" name="theme-jeu" value="sorbet"> Sorbet</label>
      </div>

      <div class="rangee">
        <button type="button" id="bouton-reprendre" class="bouton-principal">Reprendre</button>
        <button type="button" id="bouton-quitter" class="bouton-discret">Quitter la partie</button>
      </div>
    </div>
  </div>

  <section id="ecran-fin" class="ecran">
    <h2>Partie terminée</h2>
    <p id="score-final" class="bilan"></p>
    <p id="message-final" class="message-fin"></p>
    <div id="bloc-erreurs" class="bloc-erreurs" hidden>
      <p class="intitule">Erreurs commises</p>
      <ul id="liste-ratees" class="liste-rates"></ul>
    </div>
    <div class="actions">
      <button type="button" id="bouton-rejouer" class="bouton-principal">Rejouer</button>
      <button type="button" id="bouton-accueil" class="bouton-discret">Accueil</button>
    </div>
  </section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
